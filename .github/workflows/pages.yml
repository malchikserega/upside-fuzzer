name: Docs (GitHub Pages)

# Builds the MkDocs site (mkdocs.yml + docs/ + docs-site/) and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "mkdocs.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "fixtures/demo-app/*.md"
      - "fixtures/planted-bug-api/README.md"
      - "src/void/cmd/void/README.md"
      - "tools/**/README.md"
      - "tests/README.md"
      - ".work/README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs-site/requirements.txt
      - name: Build site
        run: mkdocs build
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
